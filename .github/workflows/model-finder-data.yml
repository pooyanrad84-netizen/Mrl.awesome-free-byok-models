name: Update Model Finder data

# Rebuilds docs/models.json (used by the searchable page in docs/) whenever the README changes.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/build_site.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs/models.json from README.md
        run: python scripts/build_site.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- docs/models.json; then
            echo "docs/models.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/models.json
          git commit -m "Update Model Finder data from README"
          git push
